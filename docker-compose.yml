services:
  postgres-2:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stablepay
      POSTGRES_PASSWORD: stablepay
      POSTGRES_DB: stablepay
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stablepay -d stablepay" ]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data2:/var/lib/postgresql/data

volumes:
  postgres-data2:
